replicaCount: 1

image:
  repository: ghcr.io/certforge-llc/certforge-issuer
  pullPolicy: IfNotPresent
  tag: ""  # defaults to chart appVersion

# CertForge server URL and API token.
# The token is stored in a Secret; set tokenSecret.create=true to create it
# from the token value, or create the Secret manually and set tokenSecret.name.
#
# Data residency: the URL and API token together determine which org and region
# certificate requests are routed to. Use the appropriate URL for your region:
#   US East: https://app.certgovernance.app   (default)
#   EU West:  https://eu.certgovernance.app   (GDPR-aligned)
certforge:
  url: "https://app.certgovernance.app"
  token: ""              # set this or use an existing secret
  issuanceProfileID: ""  # optional: default issuance profile ID for all certs from this issuer
  secretNamespace: ""    # optional: override namespace for the credentials Secret (ClusterIssuer only, default: certforge-system)

tokenSecret:
  create: true     # create the Secret from certforge.token
  name: certforge-credentials

leaderElect: true

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi

# NetworkPolicy: restrict pod ingress/egress to only what the controller needs.
# Disabled by default — enable in security-sensitive clusters.
# When enabled the policy allows:
#   Ingress: health probe (8081) and metrics scrape (8080) ports
#   Egress:  DNS (53 UDP/TCP), Kubernetes API (443 / 6443), CertForge API (443)
# Adjust kubeApiServerPort if your control plane uses a non-standard port.
networkPolicy:
  enabled: false
  kubeApiServerPort: 6443   # set to 443 for managed clusters (EKS, GKE, AKS)

# ServiceMonitor: Prometheus Operator integration.
# Requires prometheus-operator or kube-prometheus-stack in the cluster.
# Creates a ServiceMonitor that scrapes /metrics on port 8080.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Additional labels required by your Prometheus Operator instance's label selector.
  # Example for kube-prometheus-stack: additionalLabels: {release: prometheus}
  additionalLabels: {}
