apiVersion: v1
kind: Namespace
metadata:
  name: certforge-system
---
{{- if .Values.tokenSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tokenSecret.name }}
  namespace: certforge-system
stringData:
  token: {{ .Values.certforge.token | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: certforge-issuer
  namespace: certforge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: certforge-issuer
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status"]
    verbs: ["update", "patch"]
  # Read and annotate parent Certificate objects so the certforge.io/denied-at
  # annotation persists after denied CertificateRequests are GC'd, preventing
  # cert-manager's backoff retries from re-submitting to CertForge.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "patch"]
  # Approve/deny CertificateRequests for certforge.io issuers.
  # Required so certforge-issuer can set Denied=True on rejection, which is the
  # only truly terminal condition in cert-manager (prevents retry loops).
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
    resourceNames:
      - "certforgeclusterissuers.certforge.io/*"
      - "certforgeissuers.certforge.io/*"
  - apiGroups: ["certforge.io"]
    resources: ["certforgeissuers", "certforgeclusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certforge.io"]
    resources: ["certforgeissuers/status", "certforgeclusterissuers/status"]
    verbs: ["update", "patch"]
  # Read credential Secrets (get only — no list/watch needed)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: certforge-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: certforge-issuer
subjects:
  - kind: ServiceAccount
    name: certforge-issuer
    namespace: certforge-system
---
# Leases are namespace-scoped to certforge-system to avoid granting
# cluster-wide lease access just for leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: certforge-issuer-leader-election
  namespace: certforge-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: certforge-issuer-leader-election
  namespace: certforge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: certforge-issuer-leader-election
subjects:
  - kind: ServiceAccount
    name: certforge-issuer
    namespace: certforge-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certforge-issuer
  namespace: certforge-system
  labels:
    app: certforge-issuer
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: certforge-issuer
  template:
    metadata:
      labels:
        app: certforge-issuer
    spec:
      serviceAccountName: certforge-issuer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElect }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          {{- if .Values.workloadIdentity.enabled }}
          volumeMounts:
            - name: certforge-token
              mountPath: /var/run/secrets/certforge
              readOnly: true
          {{- end }}
      {{- if .Values.workloadIdentity.enabled }}
      volumes:
        - name: certforge-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.workloadIdentity.audience | quote }}
                  expirationSeconds: {{ .Values.workloadIdentity.expirationSeconds }}
                  path: token
      {{- end }}
      terminationGracePeriodSeconds: 10
---
# Service exposes the controller's metrics and health ports so that
# Prometheus can scrape /metrics via a ServiceMonitor, and kubectl port-forward
# works without targeting a specific pod.
apiVersion: v1
kind: Service
metadata:
  name: certforge-issuer-metrics
  namespace: certforge-system
  labels:
    app: certforge-issuer
spec:
  selector:
    app: certforge-issuer
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
