apiVersion: v1
kind: Namespace
metadata:
  name: certforge-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: certforge-issuer
  namespace: certforge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: certforge-issuer
rules:
  # Watch and update CertificateRequests (cert-manager)
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status"]
    verbs: ["update", "patch"]
  # Approve/deny CertificateRequests for certforge.io issuers.
  # Required so certforge-issuer can set Denied=True on rejection, which is the
  # only truly terminal condition in cert-manager (prevents retry loops).
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
    resourceNames:
      - "certforgeclusterissuers.certforge.io/*"
      - "certforgeissuers.certforge.io/*"
  # Manage our own CRDs
  - apiGroups: ["certforge.io"]
    resources: ["certforgeissuers", "certforgeclusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certforge.io"]
    resources: ["certforgeissuers/status", "certforgeclusterissuers/status"]
    verbs: ["update", "patch"]
  # Read credential Secrets (get only — no list/watch needed)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: certforge-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: certforge-issuer
subjects:
  - kind: ServiceAccount
    name: certforge-issuer
    namespace: certforge-system
---
# Leases are namespace-scoped to certforge-system to avoid granting
# cluster-wide lease access just for leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: certforge-issuer-leader-election
  namespace: certforge-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: certforge-issuer-leader-election
  namespace: certforge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: certforge-issuer-leader-election
subjects:
  - kind: ServiceAccount
    name: certforge-issuer
    namespace: certforge-system
