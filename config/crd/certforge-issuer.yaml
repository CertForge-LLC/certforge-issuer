apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certforgeissuers.certforge.io
spec:
  group: certforge.io
  names:
    kind: CertForgeIssuer
    listKind: CertForgeIssuerList
    plural: certforgeissuers
    singular: certforgeissuer
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [url, authSecretRef]
              properties:
                url:
                  type: string
                  pattern: '^https://'
                  description: "Base URL of the CertForge server. Use https://app.certgovernance.app for US East or https://eu.certgovernance.app for EU West."
                authSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                issuanceProfileID:
                  type: string
                  description: "Optional default issuance profile ID. Overrides the DTP default. Can be overridden per Certificate via the certforge.io/issuance-profile annotation."
                secretNamespace:
                  type: string
                  description: "Namespace to read the authSecretRef Secret from (CertForgeClusterIssuer only). Defaults to certforge-system."
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
---
