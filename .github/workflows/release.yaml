name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: certforge-llc/certforge-issuer

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create GitHub Release, upload assets
      packages: write      # push to GHCR
      id-token: write      # cosign keyless signing via GitHub OIDC
      attestations: write  # attach SBOM attestation to image

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ── Multi-arch build setup ───────────────────────────────────────────────
      # QEMU lets the builder cross-compile linux/arm64 (Graviton, AKS Arm64)
      # on an x86 runner without needing a native ARM runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@aa33708b10e362ff993539393ff100fa93ed6a27 # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from/to speeds up subsequent arm64 cross-compiles significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Cosign: keyless image signing ────────────────────────────────────────
      # Signs the image digest using GitHub Actions OIDC identity (no long-lived keys).
      # Verify with:
      #   cosign verify \
      #     --certificate-identity-regexp "https://github.com/CertForge-LLC/certforge-issuer/.github/workflows/release.yaml@refs/tags/.*" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     ghcr.io/certforge-llc/certforge-issuer:<tag>
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}

      # ── SBOM: generate and attest ─────────────────────────────────────────────
      # Generates an SPDX 2.3 SBOM for the container image and attaches it as a
      # cosign attestation on the image digest. Consumers can retrieve it with:
      #   cosign download attestation \
      #     --predicate-type https://spdx.dev/Document \
      #     ghcr.io/certforge-llc/certforge-issuer:<tag>
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}

      # ── Helm chart ───────────────────────────────────────────────────────────
      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Package Helm chart
        run: |
          helm package helm/certforge-issuer --destination /tmp/charts

      - name: Push Helm chart to OCI registry
        run: |
          helm push /tmp/charts/certforge-issuer-*.tgz oci://${{ env.REGISTRY }}/certforge-llc/charts

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            /tmp/charts/certforge-issuer-*.tgz
            sbom.spdx.json
          generate_release_notes: true
